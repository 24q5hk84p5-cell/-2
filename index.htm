‏<!DOCTYPE html>
‏<html lang="he" dir="rtl">
‏<head>
‏    <meta charset="UTF-8">
‏    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
‏    <title>הבנק הכיתתי - ח'2</title>
‏    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
‏    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
‏    <style>
‏        :root { --gold: #d4af37; --wood: #3e2723; --dark: #1a0f0d; --cream: #fff8e1; }
        
‏        * { box-sizing: border-box; }

‏        body { 
‏            margin: 0; 
‏            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
‏            background: #2d1b15; 
‏            color: var(--cream); 
‏            display: flex; 
‏            flex-direction: column;
‏            min-height: 100vh;
        }

‏        .bsd { position: fixed; top: 5px; left: 10px; font-size: 0.7rem; color: var(--gold); z-index: 3000; }
        
        /* תפריט עליון/צד משולב */
‏        .sidebar { 
‏            background: var(--dark); 
‏            border-bottom: 2px solid var(--gold); 
‏            display: flex; 
‏            flex-direction: row; 
‏            justify-content: space-around;
‏            padding: 5px 0;
‏            position: sticky;
‏            top: 0;
‏            z-index: 1000;
        }

‏        .sidebar-header { display: none; } /* מוסתר בנייד כברירת מחדל */

‏        .nav-item { 
‏            padding: 10px; 
‏            cursor: pointer; 
‏            display: flex; 
‏            flex-direction: column;
‏            align-items: center; 
‏            gap: 5px; 
‏            transition: 0.3s; 
‏            font-size: 0.85rem;
‏            color: var(--cream);
‏            flex: 1;
        }

‏        .nav-item i { font-size: 1.2rem; }
‏        .nav-item.active { background: var(--wood); color: var(--gold); border-bottom: 3px solid var(--gold); }

        /* תוכן מרכזי */
‏        .main-container { 
‏            flex: 1; 
‏            padding: 15px; 
‏            width: 100%;
‏            max-width: 800px;
‏            margin: 0 auto;
        }

‏        header { text-align: center; margin-bottom: 20px; }
‏        header h1 { font-size: 1.6rem; color: var(--gold); margin: 0; text-shadow: 1px 1px 2px #000; }
‏        header p { font-size: 0.9rem; margin: 5px 0; opacity: 0.8; }

        /* פודיום */
‏        .podium { 
‏            display: flex; 
‏            justify-content: center; 
‏            align-items: flex-end; 
‏            gap: 8px; 
‏            height: 120px; 
‏            margin: 15px 0; 
        }
‏        .step { 
‏            flex: 1;
‏            max-width: 90px;
‏            text-align: center; 
‏            padding: 8px 2px; 
‏            border-radius: 8px 8px 0 0; 
‏            color: #000; 
‏            font-weight: bold; 
‏            font-size: 0.75rem; 
‏            overflow: hidden;
‏            text-overflow: ellipsis;
‏            white-space: nowrap;
        }
‏        .step-1 { background: var(--gold); height: 100%; order: 2; box-shadow: 0 0 10px var(--gold); }
‏        .step-2 { background: #c0c0c0; height: 75%; order: 1; }
‏        .step-3 { background: #cd7f32; height: 55%; order: 3; }

        /* כרטיסיות */
‏        .card { 
‏            background: rgba(0,0,0,0.4); 
‏            border: 1.5px solid var(--gold); 
‏            border-radius: 12px; 
‏            padding: 15px; 
‏            margin-bottom: 15px; 
‏            width: 100%;
        }

‏        .card-header {
‏            display: flex; 
‏            justify-content: space-between; 
‏            align-items: center; 
‏            margin-bottom: 12px;
        }

        /* טבלה רספונסיבית */
‏        .table-container { width: 100%; overflow-x: auto; }
‏        table { width: 100%; border-collapse: collapse; text-align: center; }
‏        th { background: rgba(0,0,0,0.3); color: var(--gold); padding: 8px; font-size: 0.85rem; border-bottom: 1.5px solid var(--gold); }
‏        td { padding: 10px 5px; font-size: 0.85rem; border-bottom: 1px solid rgba(212,175,55,0.1); }
        
        /* כפתורים */
‏        .btn { 
‏            background: var(--gold); 
‏            color: #000; 
‏            border: none; 
‏            padding: 10px; 
‏            border-radius: 6px; 
‏            cursor: pointer; 
‏            font-weight: bold; 
‏            width: 100%;
‏            margin: 5px 0;
        }
‏        .btn-toggle { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 4px 10px; border-radius: 15px; font-size: 0.75rem; }

        /* מודאל */
‏        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; padding: 10px; }
‏        .modal-content { 
‏            background: var(--wood); 
‏            margin: 10px auto; 
‏            width: 100%; 
‏            max-width: 500px; 
‏            padding: 15px; 
‏            border: 2px solid var(--gold); 
‏            border-radius: 15px; 
‏            max-height: 90vh; 
‏            overflow-y: auto; 
        }

        /* התאמות למסכי מחשב */
‏        @media (min-width: 769px) {
‏            body { flex-direction: row; }
‏            .sidebar { 
‏                width: 250px; 
‏                height: 100vh; 
‏                flex-direction: column; 
‏                justify-content: flex-start; 
‏                border-bottom: none; 
‏                border-left: 2px solid var(--gold); 
            }
‏            .sidebar-header { display: block; padding: 20px; text-align: center; }
‏            .nav-item { flex-direction: row; padding: 15px 25px; font-size: 1.1rem; flex: none; width: 100%; }
‏            .nav-item.active { border-bottom: none; border-right: 5px solid var(--gold); }
        }

‏        input { width: 100%; padding: 10px; margin: 5px 0; background: #1a0f0d; border: 1px solid var(--gold); color: #fff; border-radius: 4px; }
‏    </style>
‏</head>
‏<body>

‏<div class="bsd">בס"ד</div>

‏<div class="sidebar">
‏    <div class="sidebar-header">
‏        <h2 style="color:var(--gold); margin:0; font-size: 1.2rem;">ח'2 - לוד</h2>
‏    </div>
‏    <div class="nav-item active" id="btn-home" onclick="showSection('home')">
‏        <i class="fas fa-home"></i> <span>בית</span>
‏    </div>
‏    <div class="nav-item" id="btn-shop" onclick="showSection('shop')">
‏        <i class="fas fa-store"></i> <span>חנות</span>
‏    </div>
‏    <div class="nav-item" id="btn-admin" onclick="checkAdmin()">
‏        <i class="fas fa-user-shield"></i> <span>ניהול</span>
‏    </div>
‏</div>

‏<div class="main-container">
‏    <header>
‏        <h1>💰 הבנק הכיתתי 💰</h1>
‏        <p id="sloganView"></p>
‏    </header>

‏    <div id="section-home" class="section">
‏        <div class="podium" id="podiumArea"></div>
‏        <div class="card">
‏            <div class="card-header">
‏                <h3 style="color:var(--gold); margin:0; font-size: 1rem;"><i class="fas fa-trophy"></i> דירוג</h3>
‏                <button id="showMoreBtn" class="btn-toggle" onclick="toggleFullList()">כל הכיתה</button>
‏            </div>
‏            <div class="table-container">
‏                <table>
‏                    <thead><tr><th>#</th><th>שם</th><th>יתרה</th></tr></thead>
‏                    <tbody id="leaderboardBody"></tbody>
‏                </table>
‏            </div>
‏        </div>
‏    </div>

‏    <div id="section-admin" class="section" style="display:none; flex-direction:column;">
‏        <div class="card">
‏            <h3><i class="fas fa-file-excel"></i> טעינת אקסל</h3>
‏            <input type="file" id="excelFile" accept=".xlsx, .xls">
‏        </div>
‏        <div class="card">
‏            <h3><i class="fas fa-cog"></i> הגדרות</h3>
‏            <input type="text" id="sloganInput" placeholder="סלוגן כיתתי">
‏            <button class="btn" onclick="saveSettings()">שמור</button>
‏        </div>
‏        <div class="card">
‏            <button class="btn" style="background:#555; color:#fff" onclick="resetPass()">איפוס סיסמה</button>
‏        </div>
‏    </div>

‏    <div id="section-shop" class="section" style="display:none;">
‏        <div class="card" style="text-align:center;">
‏            <h2>החנות</h2>
‏            <p>בקרוב יתווספו מוצרים...</p>
‏        </div>
‏    </div>
‏</div>

‏<div id="studentModal" class="modal">
‏    <div class="modal-content" id="modalData"></div>
‏</div>

‏<script>
    // --- הלוגיקה נשארת זהה כדי לא לפגוע בתפקוד ---
‏    let db = JSON.parse(localStorage.getItem('bank_db')) || {};
‏    let config = JSON.parse(localStorage.getItem('bank_cfg')) || { pass: "1234", slogan: "בהצלחה!", isAuth: false };
‏    let showAll = false;

‏    const pricing = {
        "מילה טובה": 5, "הצטיינות": 10, "שותף": 5, "הגעה בזמן": 5,
        "חיסור": -10, "איחור": -5, "הפרעה": -15, "חוצפה": -20, "פטפוט": -5
    };

‏    function init() {
‏        document.getElementById('sloganView').innerText = config.slogan;
‏        showSection('home');
‏        render();
    }

‏    function showSection(name) {
‏        document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
‏        document.getElementById('section-' + name).style.display = 'flex';
‏        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
‏        document.getElementById('btn-' + name).classList.add('active');
    }

‏    function checkAdmin() {
‏        const p = prompt("סיסמה:");
‏        if(p === config.pass) { config.isAuth = true; showSection('admin'); }
‏        else if(p !== null) alert("שגויה");
    }

‏    document.getElementById('excelFile').addEventListener('change', e => {
‏        const reader = new FileReader();
‏        reader.onload = ev => {
‏            const wb = XLSX.read(new Uint8Array(ev.target.result), {type: 'array'});
‏            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
‏            db = {};
‏            rows.forEach(row => {
‏                const name = row['שם התלמיד']; if(!name) return;
‏                db[name] = { total: 0, logs: [] };
‏                Object.keys(row).forEach(col => {
‏                    if(!col.includes("-")) return;
‏                    const cellVal = String(row[col] || "");
‏                    Object.keys(pricing).forEach(k => {
‏                        const regex = new RegExp(`${k}.*?:\\s*(\\d+)`, 'g');
‏                        let m;
‏                        while ((m = regex.exec(cellVal)) !== null) {
‏                            const count = parseInt(m[1]);
‏                            db[name].total += (count * pricing[k]);
‏                            db[name].logs.push({ sub: col.split("-")[0], k, c: count, s: count * pricing[k] });
                        }
                    });
                });
            });
‏            localStorage.setItem('bank_db', JSON.stringify(db));
‏            render(); alert("עודכן!");
        };
‏        reader.readAsArrayBuffer(e.target.files[0]);
    });

‏    function toggleFullList() { showAll = !showAll; render(); }

‏    function render() {
‏        const sorted = Object.keys(db).map(n => ({name: n, total: db[n].total})).sort((a,b) => b.total - a.total);
‏        const pod = document.getElementById('podiumArea'); pod.innerHTML = '';
‏        [1,0,2].forEach((idx, i) => {
‏            if(sorted[idx]) pod.innerHTML += `<div class="step step-${i+1}"><div>${sorted[idx].name.split(' ')[0]}</div><div>${sorted[idx].total}₪</div></div>`;
        });
‏        const displayData = showAll ? sorted : sorted.slice(0, 5);
‏        document.getElementById('leaderboardBody').innerHTML = displayData.map((s, i) => `
‏            <tr onclick="openStudent('${s.name}')"><td>${i+1}</td><td>${s.name}</td><td style="font-weight:bold; color:var(--gold)">${s.total}₪</td></tr>
‏        `).join('');
    }

‏    function openStudent(name) {
‏        if(!config.isAuth) {
‏            const p = prompt("סיסמה לפרטים:");
‏            if(p !== config.pass) return;
‏            config.isAuth = true;
        }
‏        const s = db[name];
‏        let h = `<h3 style="color:var(--gold);">${name}</h3><div class="table-container"><table>`;
‏        h += `<thead><tr><th>פעולה</th><th>₪</th></tr></thead><tbody>`;
‏        s.logs.forEach((l, i) => {
‏            h += `<tr><td>${l.k}</td><td style="color:${l.s>=0?'#2ecc71':'#e74c3c'}">${l.s}</td></tr>`;
        });
‏        h += `</tbody></table></div><button class="btn" onclick="closeModal()">סגור</button>`;
‏        document.getElementById('modalData').innerHTML = h;
‏        document.getElementById('studentModal').style.display = 'block';
    }

‏    function closeModal() { document.getElementById('studentModal').style.display = 'none'; }
‏    function saveSettings() { config.slogan = document.getElementById('sloganInput').value; localStorage.setItem('bank_cfg', JSON.stringify(config)); location.reload(); }
‏    function resetPass() { if(prompt("קוד איפוס:") === "9999") { config.pass="1234"; localStorage.setItem('bank_cfg', JSON.stringify(config)); location.reload(); } }
    
‏    init();
‏</script>
‏</body>
‏</html>
