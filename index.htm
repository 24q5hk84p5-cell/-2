<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מצטייני ח'2 - הגרסה המדויקת</title>
    <style>
        :root { --gold: #fbbf24; --silver: #94a3b8; --bronze: #cd7f32; --primary: #1e40af; --bg: #f8fafc; --success: #16a34a; --danger: #ef4444; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; direction: rtl; }
        .header { background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; padding: 30px; text-align: center; border-radius: 20px; margin-bottom: 30px; }
        #drop-area { border: 4px dashed #3b82f6; border-radius: 25px; padding: 40px; text-align: center; background: white; cursor: pointer; }
       
        .podium { display: flex; align-items: flex-end; justify-content: center; gap: 20px; height: 220px; margin: 60px 0; display: none; }
        .step { width: 160px; border-radius: 15px 15px 0 0; color: white; text-align: center; position: relative; padding-bottom: 15px; font-weight: bold; }
        .step1 { background: var(--gold); height: 180px; order: 2; box-shadow: 0 15px 25px rgba(251,191,36,0.4); }
        .step2 { background: var(--silver); height: 130px; order: 1; }
        .step3 { background: var(--bronze); height: 100px; order: 3; }
        .p-name { color: #1e293b; position: absolute; top: -60px; width: 100%; font-size: 1.4em; font-weight: 900; }
        .p-score { display: block; font-size: 0.65em; background: rgba(255,255,255,0.9); color: #1e40af; border-radius: 5px; padding: 2px; margin: 5px 10px; }

        .student-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; display: none; }
        .s-card { background: white; padding: 15px; border-radius: 15px; text-align: center; cursor: pointer; font-weight: bold; border: 2px solid #e2e8f0; }
        .s-card.outperformed { border-color: var(--success); background: #f0fdf4; color: var(--success); }
        .s-card.is-past { opacity: 0.5; filter: grayscale(1); }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 20px; z-index: 1001; width: 350px; box-shadow: 0 25px 50px rgba(0,0,0,0.2); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 1000; }
        .report-section { margin: 15px 0; padding: 10px; border-radius: 10px; text-align: right; }
        .good-bg { background: #f0fdf4; color: var(--success); }
        .bad-bg { background: #fef2f2; color: var(--danger); }
        .btn { cursor: pointer; padding: 12px; border: none; border-radius: 10px; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0;">🏆 נבחרי השבוע - כיתה ח'2</h1>
</div>

<div id="drop-area" onclick="document.getElementById('fileInput').click()">
    <h2>📁 לחץ להעלאת קובץ ה-CSV</h2>
    <input type="file" id="fileInput" accept=".csv" style="display:none" onchange="handleFiles(this.files)">
</div>

<div id="results-area">
    <div class="podium" id="podium">
        <div class="step step1"><div id="n1" class="p-name"></div>🥇</div>
        <div class="step step2"><div id="n2" class="p-name"></div>🥈</div>
        <div class="step step3"><div id="n3" class="p-name"></div>🥉</div>
    </div>

    <div style="text-align:center;">
        <button id="pastBtn" class="btn" style="display:none; width:200px; background:#64748b; color:white;" onclick="showPastModal()">ניהול זוכים מהעבר</button>
    </div>

    <div class="student-grid" id="studentGrid"></div>
</div>

<div class="overlay" id="overlay" onclick="closeModals()"></div>

<div class="modal" id="detailsModal">
    <h2 id="m-name" style="margin-top:0;"></h2>
    <div id="m-score" style="font-weight: bold; margin-bottom: 10px;"></div>
    <div class="report-section good-bg" id="m-good-box"><strong>💪 הצלחות:</strong><div id="m-good"></div></div>
    <div class="report-section bad-bg" id="m-bad-box"><strong>⚠️ לשיפור:</strong><div id="m-bad"></div></div>
    <button class="btn" style="background:var(--primary); color:white;" onclick="closeModals()">סגור</button>
</div>

<div class="modal" id="pastModal">
    <h3>מי כבר זכה?</h3>
    <div id="pastList" style="max-height: 250px; overflow-y: auto;"></div>
    <button class="btn" style="background:var(--primary); color:white; margin-top:10px;" onclick="closeModals()">עדכן</button>
</div>

<script>
    let db = {};
    let pastWinners = JSON.parse(localStorage.getItem('h2_v96_winners') || '[]');

    function handleFiles(files) {
        if (!files.length) return;
        const reader = new FileReader();
        reader.onload = (e) => { parseCSV(e.target.result); render(); };
        reader.readAsText(files[0], 'UTF-8');
    }

    function parseCSV(text) {
        const rows = text.split(/\r?\n/);
        db = {};
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if (row.length < 2) continue;
            const name = row[1].replace(/"/g, '').trim();
            if (!name) continue;
            db[name] = { score: 0, interruptions: 0, absences: 0, pos: [], neg: [] };
            row.forEach(cell => {
                const content = cell.replace(/"/g, '').trim();
                const regex = /([^0-9 Hebrew:]+):\s?(\d+)/g;
                let match;
                while ((match = regex.exec(content)) !== null) {
                    const type = match[1].trim(); const count = parseInt(match[2]);
                    if (/(הפרעה|פטפוט|שוטטות|חוצפה|ציוד|אי הכנת)/.test(type)) {
                        db[name].interruptions += count;
                        db[name].neg.push(`${type} (${count})`);
                        db[name].score -= (count * 3);
                    } else if (type.includes("חיסור")) {
                        db[name].absences += count;
                        db[name].neg.push(`${type} (${count})`);
                    } else if (/(מילה|הצטיינות|שותף|הגעה)/.test(type)) {
                        db[name].score += (count * 10);
                        db[name].pos.push(`${type} (${count})`);
                    }
                }
            });
        }
    }

    function render() {
        let absLimit = 2;
        let winners = [];
        // תנאי חדש: רק מי שיש לו ניקוד חיובי (score > 0) יכול לזכות
        while (absLimit <= 15) {
            winners = Object.entries(db)
                .filter(([n, d]) => d.score > 0 && d.interruptions === 0 && d.absences <= absLimit && !pastWinners.includes(n))
                .sort((a, b) => b[1].score - a[1].score);
            if (winners.length >= 3 || absLimit === 15) break;
            absLimit++;
        }

        const minScore = (winners.length >= 3) ? winners[2][1].score : (winners.length > 0 ? winners[winners.length-1][1].score : 0);

        document.getElementById('drop-area').style.display = 'none';
        document.getElementById('podium').style.display = 'flex';
        document.getElementById('studentGrid').style.display = 'grid';
        document.getElementById('pastBtn').style.display = 'inline-block';

        [1, 2, 3].forEach((rank, i) => {
            const el = document.getElementById(`n${rank}`);
            if (winners[i]) {
                el.innerHTML = `${winners[i][0]}<span class="p-score">${winners[i][1].score} נק'</span>`;
            } else { el.innerText = "---"; }
        });

        const grid = document.getElementById('studentGrid');
        grid.innerHTML = Object.keys(db).sort().map(name => {
            const s = db[name];
            const isWinner = winners.slice(0,3).some(w => w[0] === name);
            const isPotential = !isWinner && !pastWinners.includes(name) && s.score > minScore;
            let cls = "s-card" + (isPotential ? " outperformed" : "") + (pastWinners.includes(name) ? " is-past" : "");
            return `<div class="${cls}" onclick="openDetails('${name}')">${name}<br><small>${s.score} נק'</small></div>`;
        }).join('');
    }

    function openDetails(name) {
        const s = db[name];
        document.getElementById('m-name').innerText = name;
        document.getElementById('m-score').innerText = `ניקוד: ${s.score}`;
        document.getElementById('m-good').innerHTML = s.pos.length ? s.pos.join('<br>') : "אין";
        document.getElementById('m-bad').innerHTML = s.neg.length ? s.neg.join('<br>') : "נקי!";
        document.getElementById('detailsModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function showPastModal() {
        const list = document.getElementById('pastList');
        list.innerHTML = Object.keys(db).sort().map(name => `
            <div style="text-align:right; padding:5px;"><input type="checkbox" id="c-${name}" ${pastWinners.includes(name)?'checked':''} onchange="toggleWinner('${name}')"> <label for="c-${name}">${name}</label></div>
        `).join('');
        document.getElementById('pastModal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
    }

    function toggleWinner(name) {
        if (pastWinners.includes(name)) pastWinners = pastWinners.filter(n => n !== name);
        else pastWinners.push(name);
        localStorage.setItem('h2_v96_winners', JSON.stringify(pastWinners));
        render();
    }

    function closeModals() { document.querySelectorAll('.modal, .overlay').forEach(el => el.style.display = 'none'); }
</script>
</body>
</html>
